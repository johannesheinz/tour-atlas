<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Tour dates of many bands on one map and timeline." />
    <title>Tour Atlas</title>
  </head>
  <body>
    <a class="skip-link" href="#atlas">Skip to map and timeline</a>
    <div class="app">
      <header class="masthead">
        <h1 class="wordmark"><!-- brand-mark -->Tour Atlas</h1>
        <div class="search-slot" id="search"></div>
        <div class="masthead-actions">
          <button type="button" class="button" id="preview-button">Preview files</button>
          <button type="button" class="button" id="export-button">Export all</button>
          <fieldset class="theme-switch" id="theme-switch">
            <legend class="visually-hidden">Colour theme</legend>
          </fieldset>
        </div>
      </header>

      <aside class="sidebar" id="sidebar" aria-label="Bands and places">
        <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-expanded="false" aria-controls="sidebar-body"></button>
        <div class="sidebar-body" id="sidebar-body">
          <div class="sidebar-tabs" role="tablist" aria-label="Lists">
            <button type="button" role="tab" class="sidebar-tab" id="tab-bands" aria-selected="true" aria-controls="band-list">Bands</button>
            <button type="button" role="tab" class="sidebar-tab" id="tab-places" aria-selected="false" aria-controls="place-list" tabindex="-1">Places</button>
          </div>
          <div id="band-list" role="tabpanel" aria-labelledby="tab-bands"></div>
          <div id="place-list" class="place-list" role="tabpanel" aria-labelledby="tab-places" hidden></div>
        </div>
      </aside>

      <main class="stage">
        <section class="atlas" id="atlas" aria-label="Map and timeline" tabindex="-1">
          <div class="map" id="map"></div>
          <div class="atlas-toolbar">
            <div class="toolbar-row" role="toolbar" aria-label="Map controls" id="map-controls">
              <div class="toolbar-group">
                <button type="button" class="icon-button" id="zoom-in" aria-label="Zoom map in">+</button>
                <button type="button" class="icon-button" id="zoom-out" aria-label="Zoom map out">&minus;</button>
                <button type="button" class="button button-small" id="fit-map">Fit map</button>
              </div>
            </div>
            <div class="toolbar-row" role="toolbar" aria-label="Timeline controls" id="timeline-controls"></div>
            <p class="toolbar-hint" id="toolbar-hint"></p>
          </div>
          <div class="timeline" id="timeline"></div>
        </section>
        <section class="detail" id="detail" aria-label="Selected shows"></section>
        <section class="preview-panel" id="preview-panel" aria-label="Previewed files" hidden></section>
      </main>

      <footer class="colophon">
        <p>Projection: Equal Earth. Coastlines: Natural Earth via world-atlas. Geocoded venues: © OpenStreetMap contributors (ODbL).</p>
        <p>No cookies, no tracking, no network requests. Everything you preview stays in this tab.</p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
